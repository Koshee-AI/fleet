{{- if .Values.setup.enabled }}
# Admin credentials for Fleet setup job — synced from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-admin-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app: fleet
    chart: fleet
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: fleet-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: email
      remoteRef:
        key: fleetdm/admin
        property: email
    - secretKey: password
      remoteRef:
        key: fleetdm/admin
        property: password
{{- end }}
