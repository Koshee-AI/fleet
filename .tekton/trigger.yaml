# Tekton Triggers for Fleet builds
# Triggers builds on GitHub push events via Cloudflare Tunnel
#
# Prerequisites:
# - Tekton Triggers installed
# - GitHub webhook configured to POST to https://tekton.koshee.io/fleet
# - GitHub webhook secret stored in Kubernetes secret

apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: fleet-listener
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-triggers-sa
  triggers:
    # =========================================================================
    # Trigger: Push to main branch
    # =========================================================================
    - name: fleet-push-main
      interceptors:
        # Validate GitHub webhook signature
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: webhook-secret
            - name: eventTypes
              value:
                - push
        # Filter: only main branch
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: "body.ref == 'refs/heads/main'"
            - name: overlays
              value:
                - key: short_sha
                  expression: "body.after.substring(0, 7)"
                - key: branch
                  expression: "body.ref.split('/')[2]"
      bindings:
        - ref: fleet-push-binding
      template:
        ref: fleet-push-template

    # =========================================================================
    # Trigger: Version tag push (v*)
    # =========================================================================
    - name: fleet-push-tag
      interceptors:
        # Validate GitHub webhook signature
        - ref:
            name: github
            kind: ClusterInterceptor
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: webhook-secret
            - name: eventTypes
              value:
                - push
        # Filter: only version tags (v*)
        - ref:
            name: cel
            kind: ClusterInterceptor
          params:
            - name: filter
              value: "body.ref.startsWith('refs/tags/v')"
            - name: overlays
              value:
                - key: tag
                  expression: "body.ref.split('/')[2]"
      bindings:
        - ref: fleet-tag-binding
      template:
        ref: fleet-tag-template

---
# TriggerBinding for push events (main branch)
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: fleet-push-binding
  namespace: tekton-pipelines
spec:
  params:
    - name: git-revision
      value: $(body.after)
    - name: git-url
      value: $(body.repository.clone_url)
    - name: short-sha
      value: $(extensions.short_sha)
    - name: branch
      value: $(extensions.branch)

---
# TriggerBinding for tag events
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: fleet-tag-binding
  namespace: tekton-pipelines
spec:
  params:
    - name: git-revision
      value: $(body.after)
    - name: git-url
      value: $(body.repository.clone_url)
    - name: tag
      value: $(extensions.tag)

---
# TriggerTemplate for push events (uses branch-sha tag format)
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fleet-push-template
  namespace: tekton-pipelines
spec:
  params:
    - name: git-revision
    - name: git-url
    - name: short-sha
    - name: branch
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: fleet-build-$(tt.params.branch)-
        namespace: tekton-pipelines
        labels:
          tekton.dev/pipeline: fleet-build
          app.kubernetes.io/name: fleet
          app.kubernetes.io/component: build
        annotations:
          # Link back to GitHub commit
          github.com/commit: $(tt.params.git-revision)
      spec:
        pipelineRef:
          name: fleet-build
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: image-tag
            value: $(tt.params.branch)-$(tt.params.short-sha)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 5Gi
                storageClassName: ceph-block
          - name: dockerconfig
            secret:
              secretName: harbor-docker-config

---
# TriggerTemplate for tag events (uses version tag)
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: fleet-tag-template
  namespace: tekton-pipelines
spec:
  params:
    - name: git-revision
    - name: git-url
    - name: tag
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: fleet-build-$(tt.params.tag)-
        namespace: tekton-pipelines
        labels:
          tekton.dev/pipeline: fleet-build
          app.kubernetes.io/name: fleet
          app.kubernetes.io/component: build
          app.kubernetes.io/version: $(tt.params.tag)
        annotations:
          # Link back to GitHub tag
          github.com/tag: $(tt.params.tag)
      spec:
        pipelineRef:
          name: fleet-build
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: image-tag
            value: $(tt.params.tag)
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 5Gi
                storageClassName: ceph-block
          - name: dockerconfig
            secret:
              secretName: harbor-docker-config

---
# Ingress for Cloudflare Tunnel access
# The EventListener is accessed via Cloudflare Tunnel at tekton.koshee.io/fleet
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleet-event-listener
  namespace: tekton-pipelines
  annotations:
    # Cloudflare Tunnel handles TLS termination
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: tekton.koshee.io
      http:
        paths:
          - path: /fleet
            pathType: Prefix
            backend:
              service:
                name: el-fleet-listener
                port:
                  number: 8080

---
# Service Account for Tekton Triggers
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  namespace: tekton-pipelines

---
# Role for creating PipelineRuns
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tekton-triggers-role
  namespace: tekton-pipelines
rules:
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - create
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - create
      - delete
      - get
      - list

---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tekton-triggers-binding
  namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tekton-triggers-role
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: tekton-pipelines
